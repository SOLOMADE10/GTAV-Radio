<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080808"><title>Los Santos Radio</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080808;color:#fff;font-family:Arial,Helvetica,sans-serif}button{font:inherit;color:inherit}.app{min-height:100dvh;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));display:grid;grid-template-rows:auto 1fr auto;background:radial-gradient(circle at 50% 42%,#252525 0,#111 45%,#050505 80%);user-select:none}.top{display:flex;align-items:center;justify-content:space-between;z-index:10}.brand{font-weight:900;letter-spacing:.12em;font-size:clamp(12px,2.4vw,18px)}.pill{border:1px solid #ffffff35;background:#ffffff13;border-radius:999px;height:44px;padding:0 16px;cursor:pointer;backdrop-filter:blur(10px)}.stage{position:relative;min-height:0;display:grid;place-items:center}.wheelWrap{position:relative;width:min(92vw,82vh,760px);aspect-ratio:1}.ring{position:absolute;inset:0;border-radius:50%;border:1px solid #ffffff18;box-shadow:inset 0 0 80px #0008}.station{position:absolute;left:50%;top:50%;width:clamp(42px,8.2vmin,74px);height:clamp(42px,8.2vmin,74px);margin-left:calc(clamp(42px,8.2vmin,74px)/-2);margin-top:calc(clamp(42px,8.2vmin,74px)/-2);border-radius:50%;border:1px solid #ffffff38;background:#181818;box-shadow:0 5px 18px #000b;display:grid;place-items:center;text-align:center;padding:5px;font-weight:900;font-size:clamp(6px,1.05vmin,10px);line-height:1;cursor:pointer;transition:left .28s ease,top .28s ease,transform .2s ease,background .2s ease,color .2s ease,box-shadow .2s ease}.station.active{background:#fff;color:#000;border-color:#fff;transform:scale(1.32);z-index:5;box-shadow:0 0 0 5px #ffffff20,0 8px 30px #000}.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:42%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;text-align:center;padding:18px;background:#080808e8;border:1px solid #ffffff22;box-shadow:0 16px 60px #000;backdrop-filter:blur(12px)}.stationName{font-weight:950;text-transform:uppercase;font-size:clamp(17px,3.2vmin,34px);line-height:.95}.live{margin-top:10px;font-size:11px;letter-spacing:.24em;color:#d8d8d8}.live:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#fff;margin-right:7px}.arrowMode{display:none;align-items:center;justify-content:center;gap:clamp(16px,7vw,70px);width:100%}.arrow{border:0;background:transparent;font-size:clamp(50px,10vw,86px);cursor:pointer;padding:20px}.card{width:min(68vw,430px);aspect-ratio:1;border-radius:32px;border:1px solid #ffffff28;background:#101010d9;display:grid;place-items:center;text-align:center;padding:30px;box-shadow:0 20px 70px #000}.bottom{display:flex;justify-content:center;z-index:10}.volume{display:flex;align-items:center;gap:10px;border:1px solid #ffffff28;background:#ffffff10;padding:8px 12px;border-radius:999px;backdrop-filter:blur(10px)}#mute{border:0;background:transparent;font-size:20px;cursor:pointer;width:36px;height:36px}input[type=range]{width:min(45vw,260px);accent-color:#fff}.mode-arrow .wheelWrap{display:none}.mode-arrow .arrowMode{display:flex}#playerHost{position:fixed!important;left:-5000px!important;top:0!important;width:320px!important;height:180px!important;pointer-events:none!important;overflow:hidden!important;z-index:0!important}#playerHost iframe{display:block!important;width:320px!important;height:180px!important;border:0!important}.start{position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:#050505e8;backdrop-filter:blur(12px)}.start.hidden{display:none}.start button{border:1px solid #ffffff45;background:#fff;color:#000;font-weight:900;border-radius:999px;padding:16px 28px;font-size:17px;cursor:pointer}.small{position:absolute;bottom:8px;color:#ffffff60;font-size:10px;letter-spacing:.1em}@media(max-width:600px){.wheelWrap{width:min(96vw,68vh)}.station{width:clamp(38px,10.5vw,58px);height:clamp(38px,10.5vw,58px);margin-left:calc(clamp(38px,10.5vw,58px)/-2);margin-top:calc(clamp(38px,10.5vw,58px)/-2)}.hub{width:43%}.small{display:none}.pill{padding:0 12px}}
</style></head><body>
<div class="app" id="app"><header class="top"><div class="brand">LOS SANTOS RADIO</div><button class="pill" id="modeBtn">⇄ ARROWS</button></header><main class="stage"><div class="wheelWrap" id="wheel"><div class="ring"></div><div class="hub"><div><div class="stationName" id="wheelName"></div><div class="live">LIVE RADIO</div></div></div></div><div class="arrowMode"><button class="arrow" id="prev">‹</button><div class="card"><div><div class="stationName" id="arrowName"></div><div class="live">LIVE RADIO</div></div></div><button class="arrow" id="next">›</button></div><div class="small">SWIPE • SCROLL • TAP • ARROW KEYS</div></main><footer class="bottom"><div class="volume"><button id="mute">🔊</button><input id="vol" type="range" min="0" max="100" value="75" aria-label="Volume"></div></footer></div>
<div id="playerHost"></div><div class="start" id="start"><button id="startBtn">TUNE IN</button></div>
<script>
const stations=[['Non-Stop-Pop FM','I6vi-jhq3ac'],['Space 103.2','6TnV43UWoqk'],['West Coast Classics','wnmg6CfHQ18'],['Los Santos Rock Radio','xhXAJD_Q8uU'],['Radio Los Santos','C3_FSXZtRe8'],['Rebel Radio','HeLsaX1I5B4'],['The Lowdown 91.1','RT9h-C24idQ'],['The Blue Ark','LRdjhqMYSGg'],['Worldwide FM','GgIB2WClkwY'],['East Los FM','xTpsoTmhdNc'],['Channel X','HHG44PJ0oyo'],['Radio Mirror Park','SDWHIACuuaQ'],['Soulwax FM','EhsQZl8BFz8'],['FlyLo FM','3P-ux63rHkU'],['Vinewood Boulevard Radio','5fnGyUc2eFs'],['The Lab','Xy75nA56vcc'],['Los Santos Underground Radio','I2Xjuz-mnN0'],['iFruit Radio','fpvJaphZ2_g'],['Kult FM','9cL6IDCtuzs'],['Still Slipping Los Santos','P3qixldzDow'],['Music Locker Radio','dBvMBYbUZFc'],['Media Player (Radio)','dPkzYz-AYOs'],['MOTOMAMI Los Santos','30uA_Hppzpc'],['blonded Los Santos 97.8 FM','-tVumJBaTWY']];
const $=id=>document.getElementById(id), app=$('app'),wheel=$('wheel'),vol=$('vol');let idx=Number(localStorage.getItem('lsrStation')||0)%stations.length;let player=null,apiReady=false,userStarted=false,muted=false,pendingTune=false;const epoch=Date.UTC(2026,0,1);
stations.forEach((s,i)=>{const b=document.createElement('button');b.className='station';b.textContent=s[0];b.title=s[0];b.addEventListener('click',()=>tune(i));wheel.appendChild(b)});const buttons=[...wheel.querySelectorAll('.station')];
function draw(){const radius=44;buttons.forEach((b,i)=>{const rel=i-idx;const a=(rel*360/stations.length)-90;const rad=a*Math.PI/180;b.style.left=(50+Math.cos(rad)*radius)+'%';b.style.top=(50+Math.sin(rad)*radius)+'%';b.classList.toggle('active',i===idx)});$('wheelName').textContent=stations[idx][0];$('arrowName').textContent=stations[idx][0]}
function liveTime(d){return d>0?((Date.now()-epoch)/1000)%d:0}
function sync(){if(!player||!apiReady||!userStarted)return;const d=player.getDuration?.()||0;if(d>0){const t=liveTime(d);if(Math.abs((player.getCurrentTime?.()||0)-t)>3)player.seekTo(t,true)}player.setVolume(Number(vol.value));muted?player.mute():player.unMute();player.playVideo()}
function loadCurrent(){if(!player||!apiReady||!userStarted)return;pendingTune=true;player.loadVideoById({videoId:stations[idx][1],startSeconds:0});}
function tune(n){idx=(n+stations.length)%stations.length;localStorage.setItem('lsrStation',idx);draw();if(player&&apiReady&&userStarted)loadCurrent()}
window.onYouTubeIframeAPIReady=()=>{player=new YT.Player('playerHost',{width:'320',height:'180',videoId:stations[idx][1],playerVars:{autoplay:0,controls:0,playsinline:1,fs:0,rel:0,disablekb:1,iv_load_policy:3,modestbranding:1,enablejsapi:1,origin:(location.protocol==='http:'||location.protocol==='https:')?location.origin:undefined},events:{onReady:()=>{apiReady=true;if(userStarted){player.cueVideoById(stations[idx][1]);setTimeout(()=>{player.playVideo();setTimeout(sync,500)},50)}},onStateChange:e=>{if(e.data===YT.PlayerState.PLAYING&&pendingTune){pendingTune=false;setTimeout(sync,120)}if(e.data===YT.PlayerState.ENDED){player.seekTo(0,true);player.playVideo()}},onError:()=>{}}})};const tag=document.createElement('script');tag.src='https://www.youtube.com/iframe_api';document.head.appendChild(tag);
$('startBtn').onclick=()=>{userStarted=true;$('start').classList.add('hidden');if(apiReady){player.cueVideoById(stations[idx][1]);setTimeout(()=>{player.playVideo();setTimeout(sync,500)},50)}};$('next').onclick=()=>tune(idx+1);$('prev').onclick=()=>tune(idx-1);$('modeBtn').onclick=()=>{app.classList.toggle('mode-arrow');const arrow=app.classList.contains('mode-arrow');$('modeBtn').textContent=arrow?'◉ WHEEL':'⇄ ARROWS';localStorage.setItem('lsrMode',arrow?'arrow':'wheel')};if(localStorage.getItem('lsrMode')==='arrow'){$('modeBtn').click()}vol.value=localStorage.getItem('lsrVolume')||75;vol.oninput=()=>{localStorage.setItem('lsrVolume',vol.value);if(player&&apiReady)player.setVolume(Number(vol.value))};$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';if(player&&apiReady){muted?player.mute():player.unMute()}};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')tune(idx+1);else if(e.key==='ArrowLeft')tune(idx-1)});let sx=0;document.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>45)tune(idx+(dx<0?1:-1))},{passive:true});let wl=false;document.addEventListener('wheel',e=>{if(wl)return;wl=true;tune(idx+(e.deltaY>0?1:-1));setTimeout(()=>wl=false,220)},{passive:true});draw();
</script></body></html>
